name: coderabbit-review

# Branch protection cannot require CodeRabbit's own status: its state is always
# success and the outcome lives in the description, so scripts/coderabbit-gate.ts
# maps that description onto the `coderabbit-review` commit status, which is the
# context main requires. The job re-runs on every CodeRabbit status change (the
# `status` event) and on demand (`workflow_dispatch`), so the gate follows the
# review without polling: every outcome the gate maps arrives as a CodeRabbit
# commit status on the evaluated sha, and the published status is a pure
# function of the latest one. Until CodeRabbit's first status the required
# context is simply absent, which blocks merge exactly like the `pending` a
# PR-scoped run would have published early, so no pull_request trigger exists —
# one used to put a `gate` check-run on the PR head that `status` runs, sharing
# the per-sha concurrency group, kept cancelling (#124). The job only reads
# commit statuses and publishes one fixed-context status — it runs no PR code,
# so a fork PR gains nothing from it (opencode-review's plain pull_request event
# gives fork PRs a read-only token its write steps cannot live with). The
# checkout is pinned to the default branch and dispatch is limited to it, so
# the workflow file and the script always come from the base branch and the
# status event's payload sha — a PR commit — is never checked out: a PR cannot
# edit the gate that judges it. Every automated run evaluates and publishes on
# the event's own commit, so the concurrency group below is always the same sha
# the run writes to; runs for one commit are serialized with cancel-in-progress,
# and a stale evaluation cannot overwrite a newer gate status and stall the
# check.

on:
  status: {}
  workflow_dispatch:
    inputs:
      sha:
        description: commit sha to evaluate, e.g. a PR head
        required: true
        type: string

jobs:
  gate:
    # the status event fires for every commit status in the repo; only
    # CodeRabbit's own context carries a review outcome. workflow_dispatch runs
    # the workflow file of the ref it was started on, so it is limited to the
    # default branch — from a PR ref the PR's own copy would run with
    # statuses: write
    if: >-
      (github.event_name != 'status' || github.event.context == 'CodeRabbit')
      && (github.event_name != 'workflow_dispatch'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    concurrency:
      group: coderabbit-review-${{ inputs.sha || github.event.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: publish coderabbit-review status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.sha }}
          DISPATCH_SHA: ${{ inputs.sha }}
        run: |
          case "$EVENT_NAME" in
            status) bun scripts/coderabbit-gate.ts --sha "$EVENT_SHA" ;;
            workflow_dispatch) bun scripts/coderabbit-gate.ts --sha "$DISPATCH_SHA" ;;
            *) exit 1 ;;
          esac
