name: codeql

# Static security analysis of the TypeScript/JavaScript sources (issue #65).
# javascript-typescript is the only language in this repo; the default query
# suite is what the init step runs without a config file. The permissions are
# the set GitHub documents for the SARIF upload: contents to check out,
# security-events to upload results, actions:read because analyze reads the
# run's own metadata.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
