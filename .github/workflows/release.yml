name: release

on:
  # Release every push to main that passes CI. install.sh takes latest, so what gets
  # distributed is main's content, not the last hand-cut tag.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A hand-pushed tag is released as that tag. Final versions are cut this way.
  push:
    tags: ["v*"]
  # Re-release a tag that was already pushed (re-running a run that died midway, etc.).
  # New tags cannot be cut here; a missing tag fails at checkout. Cut final versions by
  # pushing a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "an existing tag to re-release (e.g. v0.1.0)"
        required: true

# Grant each job only the permissions it needs
permissions: {}

defaults:
  run:
    shell: bash

# Run automatic main releases one at a time, so two runs do not read the same highest tag
# and race for the same next tag. A group holds only one pending run and a newer one
# cancels the older, but on main an older commit would not be released anyway. Releases of
# hand-pushed tags each get their own group so a later main run cannot cancel them.
#
# Only "the CI run for a push to this repo's main" enters the main group. Other
# workflow_run events fire too (this repo's PRs, pushes to a branch named main in a fork),
# but they only skip every job. Whether a run can be cancelled is decided per run, not per
# job, so letting those runs into the same group would let a run that should be skipped
# cancel a queued main run.
concurrency:
  group: >-
    release-${{ github.event_name == 'workflow_run' &&
    (github.event.workflow_run.event == 'push' &&
    github.event.workflow_run.head_repository.full_name == github.repository && 'main' ||
    github.run_id) || github.run_id }}
  cancel-in-progress: false

jobs:
  # Pin actions by commit, not tag (the version is in the trailing comment). Build and
  # publish both run under a moved tag, so a swapped action would pass as "what was
  # checked" and "what was built". Publish signs provenance, so that swap would be
  # signed and shipped too.
  tag:
    # workflow_run fires for the CI of every branch named main, including a fork's PR
    # main, so only a push to this repo's main becomes a release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # This job runs the repo's code (mise / bun / scripts / check), so it gets no write
    # permissions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Look at the input before using it as checkout's ref. This keeps a branch name
      # from being released under a tag's name with that branch's content. The shape
      # matches what publish-release.sh compares: numbers have no leading zero and at
      # most 9 digits. Failing here means checkout and build never run.
      - name: check the requested tag
        if: github.event_name != 'workflow_run'
        env:
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shape='^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-rc\.(0|[1-9][0-9]{0,8}))?$'
          [[ "$GIVEN" =~ $shape ]] || { echo "::error::tag must be vX.Y.Z or vX.Y.Z-rc.N, 9 digits per number at most and no leading zero: $GIVEN"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          # All tags for counting the next tag, and origin/main for seeing whether main moved on
          fetch-depth: 0
          persist-credentials: false

      # Every later job uses this commit. If the tag moved after this, a commit that was
      # neither checked nor published would ship, so the commit to use is decided here and passed on
      - name: read the checked commit
        id: commit
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # setup-bun cannot read .mise.toml (only .tool-versions, package.json and
      # .bun-version), so bun's version stays in one place, .mise.toml, via the same mise
      # CI uses. The cache is off so a cache written by another run (a PR, say) is not
      # read by the build of binaries that get signed and shipped.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false

      # A main run already points at a commit CI passed, so it is used as is. A tag or
      # dispatch can point at a commit that never passed CI, so it is checked here before build.
      - name: check
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check

      - name: decide the tag
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          GIVEN: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != workflow_run ]; then
            echo "tag=$GIVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main has a newer commit and that run will release it. Releasing the older one
          # later would make old code latest. When origin/main cannot be fetched, do not
          # read it as "not moved on"; fail the whole job instead of silently skipping by
          # comparing against an empty string.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse --verify refs/remotes/origin/main)"
          head_sha="$(git rev-parse HEAD)"
          if [ "$main_sha" != "$head_sha" ]; then
            # Without a reason in the run summary for build being skipped, this would
            # only look like "green but no release", so make it an annotation.
            echo "::notice::main has moved to ${main_sha}; this run for ${head_sha} releases nothing"
            exit 0
          fi
          # A re-run for the same commit reuses the previous tag instead of cutting a
          # new one. An automatic re-run reuses only the rc tag it cut itself; a hand-cut
          # final version on the same commit is not picked.
          rc_tags="$(git tag --points-at HEAD --list 'v*-rc.*')"
          # grep exits 1 when nothing matches, so only that is accepted as empty (a git
          # failure stops at the assignment above). It uses the same shape as
          # publish-release.sh, so a tag picked here can be released later.
          existing="$(printf '%s\n' "$rc_tags" | grep -E '^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})-rc\.(0|[1-9][0-9]{0,8})$' | sort -V | tail -n 1)" || existing=""
          # Keep the command substitution in an assignment. Inside echo's arguments a
          # failure would not stop set -e and the run would end green with an empty tag.
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            tag="$(bun scripts/next-tag.ts)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    # No write or signing permissions. Only the publish job can create tags or releases,
    # leaving no room for build to cut a tag under a moved tag.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Build the commit the tag job checked, as is. Even if the tag moved afterwards, no
      # binary is built from an unchecked commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - run: bun install --frozen-lockfile

      # bun cross-compiles, so all four are built on one machine. Splitting runners per
      # OS would weaken the guarantee they came from the same input. scripts/build.ts is
      # the source of truth for the build. RELEASE_TAG is embedded into --version.
      - name: build
        env:
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          set -eux
          bun run build
          cd dist && sha256sum uptime-kuma-cli-* > SHA256SUMS && cat SHA256SUMS

      # Only linux-x64 runs on this runner. --version checks that the embedding worked;
      # a binary naming a version other than the tag is not shipped. The other three
      # cannot run here, so check-binaries.sh inspects their shape and embedding with
      # file(1) and then runs this one. Only the verify job's runners can run the other
      # three, so running them is left to that job.
      - name: check the built binaries
        run: sh scripts/check-binaries.sh

      # The only thing published is the archive uploaded here. Publish and verify only
      # download it, so what was checked is what gets published. If the artifact is
      # missing the download side stops, so there is no path that ships an empty dist.
      # if-no-files-found does not catch a partial upload, so confirming all four are
      # present is left to check-binaries.sh.
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          # Only this run's verify and publish read it, so pick the shorter one
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/uptime-kuma-cli-*
            dist/SHA256SUMS

  verify:
    needs: [tag, build]
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
    # Do not let one failure stop the rest; all four leave their result on the run
    # (publish stops on any single failure)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    # timeout-minutes counts the wait for a runner too, so the budget must absorb
    # queue starvation — a leg sat queued ~25 min and a 15-minute cap cancelled it
    # before its first step, skipping publish (#98). It still caps a hung binary so
    # one cannot hold up the next main release
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    steps:
      # The script being run also comes from the same commit as build. Only that one
      # script is used; neither bun nor mise is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      - name: check the sum and run the binary
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          # Check what was downloaded against build's SHA256SUMS. Use whichever tool is
          # available (sha256sum / shasum) so every runner does the same check.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
          sh scripts/run-binary.sh "dist/uptime-kuma-cli-$TARGET" "$TAG"

  # Publish only the shape verify ran all four of. Nothing is published when any needed
  # job failed (or was skipped)
  publish:
    needs: [tag, build, verify]
    if: needs.tag.outputs.tag != ''
    # Every trigger's publish shares one group, so the MAIN_SHA read and the release
    # creation in the release step are not interleaved with another publish — without
    # it, a run for an older commit could take Latest back from a newer release, and
    # install.sh installs Latest. Only this job queues; tag, build and verify still run
    # in parallel across runs. queue: max holds up to 100 waiting publishes rather than
    # the default single pending slot a newer arrival would cancel, so a queued
    # hand-cut release is not dropped; cancel-in-progress stays false so a running
    # publish is never cut off.
    concurrency:
      group: release-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      # The checksum lives in the same release, so it proves nothing about authenticity.
      # Add provenance so it can be verified which workflow built it from which commit.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      # Take the release contents and the downloaded dist/ from the same commit. A script
      # from a different commit would make what is published differ from what was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      # Download exactly what build uploaded. This dist/ is both what gets attested and
      # what lands on the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist

      # Confirm all four match the sums build produced before signing. What is signed and
      # what lands on the release are this same dist/, so published and signed things are not split.
      - name: check the sums
        working-directory: dist
        run: |
          set -eux
          sha256sum -c SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/uptime-kuma-cli-*"

      # publish-release.sh creates the tag via the API before creating the release.
      # contents: write is needed not only to create the tag but for the release itself.
      # A tag made with this token does not trigger a workflow, so the tag push trigger
      # above does not release it a second time.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          # The three paths (push / workflow_run / workflow_dispatch) differ in how they
          # treat "a tag on a commit that is not main's head". The script can tell them
          # apart only by event name, so pass it
          RELEASE_TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # To compare against main's head and to let publish-release.sh check "who the
          # tag already belongs to". Version comparison uses gh release list. The checkout
          # is shallow, so tags are not fetched on their own.
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
          MAIN_SHA="$(git rev-parse --verify refs/remotes/origin/main)"
          export MAIN_SHA
          sh scripts/publish-release.sh
