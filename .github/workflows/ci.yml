name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Mistakes in release.yml and install.sh otherwise surface only when a tag is cut or
  # someone runs curl | sh; catch them here first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install.sh is piped into sh, so a mistake there costs the most
      - name: shellcheck (install.sh, publish-release.sh, check-binaries.sh, run-binary.sh)
        run: shellcheck install.sh scripts/publish-release.sh scripts/check-binaries.sh scripts/run-binary.sh
      # Upstream has no release that knows the concurrency `queue` key yet
      # (rhysd/actionlint#657 is still open), so this is the fork that issue tracks.
      # Move back to rhysd/actionlint once a release there accepts `queue`. The image
      # is digest-pinned like the rest; it only parses workflow YAML and the job
      # holds contents: read.
      - uses: docker://kjanat/actionlint@sha256:c0a63b3e5c974c2466ead39404b70e448176beaff8c5ec7af0b2e96191aea661 # v1.17.1
        with:
          args: -color

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Fails on known vulnerabilities in the locked dependency tree. bun audit
      # reads bun.lock, so it covers transitive deps that Dependabot's alerts
      # cannot see (the dependency graph reads package.json, not bun.lock).
      # Accepting a finding is a --ignore flag on this line, so each acceptance
      # stays in this file's history and gets re-read on review.
      - name: dependency audit
        run: bun audit

  # Whole-project and PR-diff line coverage gates (issue #59). fetch-depth 0 so
  # `git diff <base>...HEAD` can find the merge base.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - name: unit tests with lcov coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: whole-project line coverage >= 90%
        run: bun scripts/coverage.ts whole
      - name: diff line coverage >= 90%
        if: github.event_name == 'pull_request'
        run: bun scripts/coverage.ts diff --base "${{ github.event.pull_request.base.sha }}"

  # Mutation testing on PR-changed src lines. Report-only: surviving mutants
  # are posted as a PR comment and never fail the job. The concurrency group
  # keeps an older, slower run from overwriting a newer run's comment.
  mutation:
    if: github.event_name == 'pull_request'
    concurrency:
      group: mutation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      # actions: read lets the upsert step list workflow runs to tell a
      # superseded run (a newer sibling exists) from a timeout-cancelled one
      # before posting the "no report" fallback
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # the PR head, not the merge commit: the diff and mutant line
          # numbers then match the author's files, and the head SHA in the
          # report is a real commit on the PR
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # mewt publishes no builds for linux-arm64 or macOS-x64, so it stays out
      # of .mise.toml where `mise install` would fail on those platforms; -g
      # registers it for this job's shims without touching the repo config.
      - run: mise use -g github:trailofbits/mewt@4.0.0
      - run: bun install --frozen-lockfile
      - name: mutation report
        run: bun scripts/mutation-report.ts --base "${{ github.event.pull_request.base.sha }}" --out mutation-report.md
      # Fork PRs get a read-only token, so the comment step only runs for
      # same-repo branches; the report stays in the job log there.
      - name: upsert PR comment
        # Runs on cancelled jobs too: a timeout-cancelled run is still the PR's
        # latest mutation result, and skipping it would leave an older report
        # posing as current. The script stays silent only when fresher news
        # is on its way or already posted — see the guard in the run block.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        # bash gives -eo pipefail: without it a failed gh api can still let
        # the jq side of the comment lookup succeed on gh's error JSON
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          report=mutation-report.md
          # A produced report always posts, even on a cancelled job: it is
          # real mutant data for its own sha, fresher than whatever the
          # comment currently shows, and any newer run overwrites it when it
          # finishes. Only the no-report fallback needs the guard below.
          if [ ! -f "$report" ]; then
            # Only a newer run for this same pull request can carry fresher
            # news to the comment. Runs are checked before comments on
            # purpose: a run that already completed has finished its upsert
            # step, so its marker is visible to the comment read that
            # follows — reading them the other way around leaves a window
            # where a just-finished run's post is overwritten by this
            # fallback. A newer run silences the fallback while it is still
            # in progress — it is trusted to reach its own upsert step; if
            # it dies before its mutation job starts, nothing is posted
            # until the next run — or once the comment carries a newer run's
            # marker, meaning a newer run already posted. A run that
            # finished without posting (cancelled before its upsert step
            # ran, or deferred to a run that itself never notified) leaves
            # no marker behind, and an older run posting late carries an
            # older id, so neither can be mistaken for fresher news. Lookup
            # failures still post: a possibly stale comment is corrected by
            # the next run, a missing one never is.
            if ! active=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              --method GET \
              -f branch="$HEAD_REF" \
              -f event=pull_request \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.id > (env.GITHUB_RUN_ID | tonumber) and .head_repository.full_name == env.GITHUB_REPOSITORY and ([.pull_requests[]?.number] | index(env.PR | tonumber)) != null and (.status // "completed") != "completed")] | length'); then
              active=0
            fi
            if [ "$active" -gt 0 ]; then
              exit 0
            fi
            if ! commented=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- mutation-testing -->"))) | .body | capture("<!-- mutation-run: (?<rid>[0-9]+) -->")? | .rid | tonumber] | max // 0' \
              | jq -s '[.[] | numbers] | max // 0'); then
              commented=0
            fi
            if [ "$commented" -gt "$GITHUB_RUN_ID" ]; then
              exit 0
            fi
            {
              echo '<!-- mutation-testing -->'
              echo ''
              echo '## Mutation testing (report-only)'
              echo ''
              echo "The mutation run produced no report — the job failed, timed out, or was cancelled. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$report"
          fi
          jq -n --rawfile body "$report" --arg rid "$GITHUB_RUN_ID" '{body: ($body + "\n\n<!-- mutation-run: " + $rid + " -->")}' > /tmp/mutation-comment.json
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- mutation-testing -->"))) | .id')
          existing=${ids%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input /tmp/mutation-comment.json
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input /tmp/mutation-comment.json
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [louislam/uptime-kuma:1.23.17, louislam/uptime-kuma:2.5.11]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
        env:
          UPTIME_KUMA_IT_IMAGE: ${{ matrix.image }}
          UPTIME_KUMA_IT_SHARD: ${{ matrix.shard }}/3
