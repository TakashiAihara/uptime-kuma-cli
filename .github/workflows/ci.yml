name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Mistakes in release.yml and install.sh otherwise surface only when a tag is cut or
  # someone runs curl | sh; catch them here first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # install.sh is piped into sh, so a mistake there costs the most
      - name: shellcheck (install.sh, publish-release.sh, check-binaries.sh, run-binary.sh)
        run: shellcheck install.sh scripts/publish-release.sh scripts/check-binaries.sh scripts/run-binary.sh
      # Upstream has no release that knows the concurrency `queue` key yet
      # (rhysd/actionlint#657 is still open), so this is the fork that issue tracks.
      # Move back to rhysd/actionlint once a release there accepts `queue`. The image
      # is digest-pinned like the rest; it only parses workflow YAML and the job
      # holds contents: read.
      - uses: docker://kjanat/actionlint@sha256:c0a63b3e5c974c2466ead39404b70e448176beaff8c5ec7af0b2e96191aea661 # v1.17.1
        with:
          args: -color

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Fails on known vulnerabilities in the locked dependency tree. bun audit
      # reads bun.lock, so it covers transitive deps that Dependabot's alerts
      # cannot see (the dependency graph reads package.json, not bun.lock).
      # Accepting a finding is a --ignore flag on this line, so each acceptance
      # stays in this file's history and gets re-read on review.
      - name: dependency audit
        run: bun audit

  # Whole-project and PR-diff line coverage gates (issue #59). fetch-depth 0 so
  # `git diff <base>...HEAD` can find the merge base.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - name: unit tests with lcov coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: whole-project line coverage >= 90%
        run: bun scripts/coverage.ts whole
      - name: diff line coverage >= 90%
        if: github.event_name == 'pull_request'
        run: bun scripts/coverage.ts diff --base "${{ github.event.pull_request.base.sha }}"

  # Mutation testing on PR-changed src lines. Report-only: surviving mutants
  # are posted as a PR comment and never fail the job. The concurrency group
  # keeps an older, slower run from overwriting a newer run's comment.
  mutation:
    if: github.event_name == 'pull_request'
    concurrency:
      group: mutation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # the PR head, not the merge commit: the diff and mutant line
          # numbers then match the author's files, and the head SHA in the
          # report is a real commit on the PR
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # mewt publishes no builds for linux-arm64 or macOS-x64, so it stays out
      # of .mise.toml where `mise install` would fail on those platforms; -g
      # registers it for this job's shims without touching the repo config.
      - run: mise use -g github:trailofbits/mewt@4.0.0
      - run: bun install --frozen-lockfile
      - name: mutation report
        run: bun scripts/mutation-report.ts --base "${{ github.event.pull_request.base.sha }}" --out mutation-report.md
      # Fork PRs get a read-only token, so the comment step only runs for
      # same-repo branches; the report stays in the job log there.
      - name: upsert PR comment
        # cancelled runs are superseded by a newer push; posting the failure
        # fallback for them would briefly show a stale "failed" comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          report=mutation-report.md
          if [ ! -f "$report" ]; then
            {
              echo '<!-- mutation-testing -->'
              echo ''
              echo '## Mutation testing (report-only)'
              echo ''
              echo "The mutation run produced no report — the job failed or timed out. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$report"
          fi
          jq -n --rawfile body "$report" '{body: $body}' > /tmp/mutation-comment.json
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- mutation-testing -->"))) | .id')
          existing=${ids%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input /tmp/mutation-comment.json
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input /tmp/mutation-comment.json
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [louislam/uptime-kuma:1.23.17, louislam/uptime-kuma:2.5.11]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
        env:
          UPTIME_KUMA_IT_IMAGE: ${{ matrix.image }}
          UPTIME_KUMA_IT_SHARD: ${{ matrix.shard }}/3
